name: MLOps CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ feature/*, bugfix/* ]

jobs:
  lint-and-test:
    name: Lint, Validate Config & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting
        run: |
          ruff check . --ignore E501,E402

      - name: Validate Single-Source Configuration
        run: |
          python config/schema.py

      - name: Run Test Suite with Pytest
        run: |
          pytest -v --durations=10

      - name: Pipeline Stage Smoke Test
        run: |
          python -m src.pipeline.run_stage --stage ingest
          python -m src.pipeline.run_stage --stage validate_data
          python -m src.pipeline.run_stage --stage build_features
          python -m src.pipeline.run_stage --stage train
          python -m src.pipeline.run_stage --stage validate_model
          python -m src.pipeline.run_stage --stage deploy
          python -m src.pipeline.run_stage --stage monitor

      - name: Demonstrate Safe Failure Gate Scenarios
        run: |
          python scripts/run_failure_scenarios.py
