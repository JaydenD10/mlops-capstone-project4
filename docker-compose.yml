version: "3.8"

services:
  # 1. FastAPI Model Serving Service
  model-serving:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-house-price-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mlops-network

  # 2. Prometheus Operational Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: mlops-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - model-serving
    restart: unless-stopped
    networks:
      - mlops-network

  # 3. Streamlit Drift & Operational Monitoring Dashboard
  monitoring-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-monitoring-dashboard
    entrypoint: ["streamlit", "run", "src/monitoring/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./reports:/app/reports:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    depends_on:
      - model-serving
    restart: unless-stopped
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
